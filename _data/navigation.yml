# Site navigation, per language.
#
# `key` links the entry to its translated label in _data/i18n.yml (nav_<key>)
# and marks the active page: set `navbar_key` in a page's front matter to the
# same value.
pages:
  en:
  - key: home
    url: /
  - key: publications
    url: /publications
  - key: more
    url: /more
  de:
  - key: home
    url: /de/
  - key: publications
    url: /de/publications
  - key: more
    url: /de/more
